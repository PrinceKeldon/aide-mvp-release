<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDE - Morning Brief</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 10px;
        }
        
        .header .summary {
            color: #718096;
            font-size: 16px;
        }
        
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .icon {
            font-size: 24px;
            margin-right: 12px;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a202c;
            flex: 1;
        }
        
        .priority-high {
            border-left: 4px solid #f56565;
        }
        
        .priority-medium {
            border-left: 4px solid #ed8936;
        }
        
        .priority-low {
            border-left: 4px solid #48bb78;
        }
        
        .card-reason {
            color: #718096;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .card-content {
            margin-bottom: 16px;
        }
        
        .message-to {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .message-body {
            background: #f7fafc;
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        .actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .empty-state {
            background: white;
            padding: 60px;
            border-radius: 12px;
            text-align: center;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .empty-state-text {
            font-size: 18px;
            color: #718096;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">
            <div>Loading your morning brief...</div>
        </div>
        
        <div id="content" style="display: none;">
            <div class="header">
                <h1 id="headline">Good morning.</h1>
                <div class="summary" id="summary"></div>
            </div>
            
            <div id="items"></div>
            
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-state-icon">✨</div>
                <div class="empty-state-text">Your day is clear. Nothing urgent needs preparation.</div>
            </div>
        </div>
    </div>

    <script>
        async function loadBrief() {
            try {
                const response = await fetch('/api/brief');
                const data = await response.json();
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                // Update header
                document.getElementById('headline').textContent = data.summary.headline;
                
                // Update summary
                const counts = data.summary.counts;
                const parts = [];
                if (counts.draft_messages > 0) parts.push(`${counts.draft_messages} message(s)`);
                if (counts.prepared_tasks > 0) parts.push(`${counts.prepared_tasks} task(s)`);
                document.getElementById('summary').textContent = parts.join(', ');
                
                // Render items
                const itemsContainer = document.getElementById('items');
                
                if (data.items.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }
                
                data.items.forEach(item => {
                    const card = createCard(item);
                    itemsContainer.appendChild(card);
                });
                
            } catch (error) {
                console.error('Failed to load brief:', error);
                document.getElementById('loading').textContent = 'Failed to load brief. Try generating one first.';
            }
        }
        
        function createCard(item) {
            const card = document.createElement('div');
            card.className = `card priority-${item.priority}`;
            card.id = `item-${item.id}`;
            
            const typeIcons = {
                'draft_message': '✉️',
                'prepared_task': '📋',
                'approval_request': '⚠️'
            };
            
            const icon = typeIcons[item.type] || '📄';
            
            let contentHtml = '';
            
            if (item.type === 'draft_message') {
                const content = item.content;
                contentHtml = `
                    <div class="card-content">
                        <div class="message-to">To: ${content.recipient_name}</div>
                        ${content.subject ? `<div class="message-to">Subject: ${content.subject}</div>` : ''}
                        <div class="message-body">${content.body}</div>
                    </div>
                `;
            } else if (item.type === 'prepared_task') {
                contentHtml = `
                    <div class="card-content">
                        <div class="message-body">${item.content.content}</div>
                    </div>
                `;
            }
            
            const actionsHtml = item.actions.map(action => {
                const btnClass = action === 'send' || action === 'approve' ? 'btn-primary' : 
                               action === 'dismiss' || action === 'deny' ? 'btn-danger' : 
                               'btn-secondary';
                return `<button class="btn ${btnClass}" onclick="handleAction('${item.id}', '${action}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">${action.toUpperCase()}</button>`;
            }).join('');
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="icon">${icon}</span>
                    <div class="card-title">${item.title}</div>
                </div>
                <div class="card-reason">${item.reason}</div>
                ${contentHtml}
                <div class="actions">
                    ${actionsHtml}
                </div>
            `;
            
            return card;
        }
        
        async function handleAction(itemId, action, item) {
            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        item_id: itemId,
                        action: action,
                        item: item
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Remove card
                    const card = document.getElementById(`item-${itemId}`);
                    card.style.opacity = '0';
                    setTimeout(() => card.remove(), 300);
                    
                    // Check if all items handled
                    setTimeout(() => {
                        const remaining = document.querySelectorAll('.card').length;
                        if (remaining === 0) {
                            document.getElementById('empty-state').style.display = 'block';
                        }
                    }, 400);
                }
            } catch (error) {
                console.error('Action failed:', error);
                alert('Action failed. Please try again.');
            }
        }
        
        // Load brief on page load
        loadBrief();
    </script>
</body>
</html>
